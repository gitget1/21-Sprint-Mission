<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!--헤더 부분-->
  <header>
      <a  href="/"><img class="logo-image" src="images/logo.png" alt="판다마켓"></a>
    <a class="login-button" href="/login.html">로그인</a>
  </header>
  <main>
    <!--헤더 밑 메인의 섹션1부분-->
    <section id="main-section-1" class="main-section">
      <div class="main-content">
        <p class="main-title">일상의 모든 물건을<br>거래해 보세요</p>
        <a class="main-button" href="/items.html">구경하러 가기</a>
      </div>
    </section>
    <!--메인의 섹션 2 (판다 마켓의 특징 3가지지)-->
    <section class="main-section-2">
      <div class="feature-item">
        <img src="/images/Img_home_01.png" alt="인기 상품">
        <div class="feature-content feature-right">
          <p class="feature-label">Hot item</p>
          <h2 class="feature-title">인기 상품을<br>확인해 보세요</h2>
          <p class="feature-description">가장 HOT한 중고거래 물품을<br> 판다 마켓에서 확인해 보세요</p>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-content feature-left">
          <p class="feature-label">Search</p>
          <h2 class="feature-title">구매를 원하는<br>상품을 검색하세요</h2>
          <p class="feature-description">구매하고 싶은 물품은<br>검색해서 쉽게 찾아보세요</p>
        </div>
        <img src="/images/Img_home_02.png" alt="검색">
      </div>
      <div class="feature-item">
        <img src="/images/Img_home_03.png" alt="등록">
        <div class="feature-content feature-right">
          <p class="feature-label">Register</p>
          <h2 class="feature-title">판매를 원하는<br>상품을 등록하세요</h2>
          <p class="feature-description">어떤 물건이든 판매하고 싶은 상품을<br> 쉽게 등록하세요</p>
        </div>
      </div>
    </section>
    <section id="main-bottom" class="main-section-3">
      <div class="bottom-content">
        <p class="bottom-text">믿을 수 있는<br>판다마켓 중고 거래</p>
      </div>
    </section>
    <!--footer sns플렛폼의 메인홈페이지, Privacy Policy와 FAQ의 페이지 이동동-->
    <footer>
      <div>@codeit - 2025</div>
      <div class="footermenu"><a href="/privacy.html">Privacy Policy</a><a href="/faq.html">FAQ</a></div>
      <div class="sns-button">
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer"><img src="images/ic_facebook.svg"></a>
        <a href="https://www.x.com" target="_blank" rel="noopener noreferrer"><img src="images/ic_twitter.svg"></a>
        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><img src="images/ic_youtube.svg"></a>
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer"><img src="images/ic_instagram.svg"></a>
      </div>
