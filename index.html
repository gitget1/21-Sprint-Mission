<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="./Css/style.css">
</head>
<body>
  <!--헤더 부분-->
  <header class="header">
      <a href="index.html"><img class="header__logo" src="images/logo.png" alt="판다마켓"></a>
      <a class="header__button" href="../pages/login.html">로그인</a>
  </header>
  <main>
    <!--헤더 밑 메인의 섹션1부분-->
    <section class="Top-section">
      <div class="Top-section__content">
        <p class="Top-section__title">일상의 모든 물건을<br>거래해 보세요</p>
        <a class="Top-section__button" href="html/items.html">구경하러 가기</a>
      </div>
    </section>
    <!--메인의 섹션 2 (판다 마켓의 특징 3가지)-->
    <section class="features-section">
      <div class="features-section__item">
        <img class="features-section__image" src="images/Img_home_01.png" alt="인기 상품">
        <div class="features-section__content features-section__content--right">
          <p class="features-section__label">Hot item</p>
          <h2 class="features-section__title">인기 상품을<br>확인해 보세요</h2>
          <p class="features-section__description">가장 HOT한 중고거래 물품을<br> 판다 마켓에서 확인해 보세요</p>
        </div>
      </div>
      <div class="features-section__item">
        <div class="features-section__content features-section__content--left">
          <p class="features-section__label">Search</p>
          <h2 class="features-section__title">구매를 원하는<br>상품을 검색하세요</h2>
          <p class="features-section__description">구매하고 싶은 물품은<br>검색해서 쉽게 찾아보세요</p>
        </div>
        <img class="features-section__image" src="images/Img_home_02.png" alt="검색">
      </div>
      <div class="features-section__item">
        <img class="features-section__image" src="images/Img_home_03.png" alt="등록">
        <div class="features-section__content features-section__content--right">
          <p class="features-section__label">Register</p>
          <h2 class="features-section__title">판매를 원하는<br>상품을 등록하세요</h2>
          <p class="features-section__description">어떤 물건이든 판매하고 싶은 상품을<br> 쉽게 등록하세요</p>
        </div>
      </div>
    </section>
    <section class="cta-section cta-section--with-image">
      <div class="cta-section__content">
        <p class="cta-section__text">믿을 수 있는<br>판다마켓 중고 거래</p>
      </div>
    </section>
    <!--footer sns플렛폼의 메인홈페이지, Privacy Policy와 FAQ의 페이지 이동-->
    <footer class="footer">
      <div class="footer__copyright">@codeit - 2025</div>
      <div class="footer__menu">
        <a class="footer__menu-link" href="html/privacy.html">Privacy Policy</a>
        <a class="footer__menu-link" href="html/faq.html">FAQ</a>
      </div>
      <div class="footer__sns">
        <a class="footer__sns-link" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer"><img class="footer__sns-icon" src="images/ic_facebook.svg"></a>
        <a class="footer__sns-link" href="https://www.x.com" target="_blank" rel="noopener noreferrer"><img class="footer__sns-icon" src="images/ic_twitter.svg"></a>
        <a class="footer__sns-link" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><img class="footer__sns-icon" src="images/ic_youtube.svg"></a>
        <a class="footer__sns-link" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer"><img class="footer__sns-icon" src="images/ic_instagram.svg"></a>
      </div>
    </footer>
  </main>
</body>
</html>
